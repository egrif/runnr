# Every merge to main is a release. A pull request must pass "test" and
# "changelog" (its CHANGELOG.md starts with a new, dated version: "## v1.2.3
# — 2026-10-22"); main's ruleset requires both. On main, the version the
# changelog names is tagged, built and published with its notes.
name: test and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh tmux >/dev/null
          go vet ./...
          go test ./...

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The changelog names a new release
        run: .github/scripts/changelog.sh check

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What to release
        id: what
        run: |
          v=$(.github/scripts/changelog.sh version)
          if [[ -z $v ]]; then
            echo "::warning::The top of CHANGELOG.md names no version: nothing to release."
          elif git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "$v is tagged already: nothing to release."
            v=
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.what.outputs.version != ''
        with:
          go-version-file: go.mod

      - name: Build
        if: steps.what.outputs.version != ''
        env:
          V: ${{ steps.what.outputs.version }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            out=dist/runnr-$V-$os-$arch
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/egrif/runnr/internal/cli.version=$V" -o "$out/runnr" ./cmd/runnr
            tar -C "$out" -czf "$out.tar.gz" runnr
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Tag and publish
        if: steps.what.outputs.version != ''
        env:
          V: ${{ steps.what.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/changelog.sh notes "$V" > notes.md
          git tag -a "$V" -m "runnr $V"
          git push origin "$V"
          gh release create "$V" --verify-tag --title "runnr $V" --notes-file notes.md dist/*.tar.gz dist/checksums.txt
